en:
  page_title: Stage
  page_icon: ph:bold/flow-arrow
  intro: >-
    symfony-stage: a surface the pointer moves and elements laid on it — picked,
    dragged onto a grid, linked, removed, every change undone and done again.
    The stage draws the elements the page hands it and knows nothing of what
    they mean: each one here is one of its figures (stage-shape) — a box for a
    step, a circle for an event, a diamond for a choice.
  section:
    timeline:
      title: A timeline
      description: >-
        The surface moves along its line only (axis x), as a process reads. Drag
        the surface to move it, a card to move it; Shift and drag picks several;
        the arrows move the picked ones, Delete removes them, Ctrl+Z undoes and
        Ctrl+Shift+Z does again.

fr:
  page_title: Scène
  page_icon: ph:bold/flow-arrow
  intro: >-
    symfony-stage : une surface que le pointeur déplace et des éléments posés
    dessus — choisis, glissés sur une grille, reliés, retirés, chaque changement
    annulé et refait. La scène dessine les éléments que la page lui donne et
    ignore ce qu'ils signifient : chacun ici est une de ses figures
    (stage-shape) — une boîte pour une étape, un cercle pour un événement, un
    losange pour un choix.
  section:
    timeline:
      title: Une frise
      description: >-
        La surface ne se déplace que sur sa ligne (axe x), comme se lit un
        processus. Glisser la surface la déplace, glisser une carte la déplace ;
        Maj et glisser en choisit plusieurs ; les flèches déplacent les éléments
        choisis, Suppr les retire, Ctrl+Z annule et Ctrl+Maj+Z refait.

zh:
  page_title: 舞台
  page_icon: 'ph:bold/flow-arrow'
  intro: symfony-stage：一个指针移动的表面，上面放置了元素——可以选择、拖动到网格上、链接、移除，每个变化都可以撤销和重做。舞台绘制页面交给它的元素，对它们的意义一无所知：这里的每一个都是它的图形（舞台形状）——一个步骤的框，一个事件的圆，一个选择的菱形。
  section:
    timeline:
      title: 时间轴
      description: 表面仅沿其线（x轴）移动，作为一个过程读取。拖动表面以移动它，拖动卡片以移动它；按住Shift并拖动可以选择多个；箭头移动所选的元素，删除键移除它们，Ctrl+Z撤销，Ctrl+Shift+Z重做.

ar:
  page_title: المسرح
  page_icon: 'ph:bold/flow-arrow'
  intro: 'symfony-stage: مساحة يتحرك عليها المؤشر وتوضع العناصر عليها — تُختار، تُسحب إلى شبكة، تُربط، تُزال، كل تغيير يُلغى ويُعاد مرة أخرى. المسرح يرسم العناصر التي تسلمها الصفحة ولا يعرف شيئًا عما تعنيه: كل واحدة هنا هي واحدة من أشكالها (stage-shape) — صندوق لخطوة، دائرة لحدث، ماسة لاختيار.'
  section:
    timeline:
      title: 'خط زمني'
      description: 'السطح يتحرك على طول خطه فقط (محور س)، بينما يقرأ العملية. اسحب السطح لتحريكه، بطاقة لتحريكه؛ Shift والسحب يختار عدة؛ الأسهم تحرك المختارة، Delete تزيلها، Ctrl+Z يلغي و Ctrl+Shift+Z يعيدها.'
